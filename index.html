<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心連心智能平安鐘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; 
    background: #fdf5eb; margin: 0; padding: 12px; color: #3a2e20; 
  }
  .container { max-width: 900px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 16px; }
  h1 { color: #e85d2c; margin: 0; font-size: clamp(20px, 5vw, 28px); }
  .overview { 
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
    background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .overview-item { text-align: center; padding: 12px 8px; border-radius: 12px; }
  .overview-item.fall { background: #fff5f0; }
  .overview-item.care { background: #f0fff4; }
  .overview-item.confirm { background: #f0f8ff; }
  .overview-item .icon { font-size: 28px; }
  .overview-item .label { font-size: 13px; color: #9c8770; margin: 4px 0; }
  .overview-item .count { font-size: 24px; font-weight: bold; }
  .overview-item.fall .count { color: #e85d2c; }
  .overview-item.care .count { color: #6f8f71; }
  .overview-item.confirm .count { color: #4a90d9; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .card { background: white; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card h3 { margin: 0 0 8px; color: #9c8770; font-size: 14px; }
  .big { font-size: 24px; font-weight: bold; }
  .on { color: #6f8f71; }
  .off { color: #9c8770; }
  .emergency { color: #e85d2c; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .section { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: center; }
  th { background: #f5c77c; }
  button { background: #e85d2c; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; }
  .footer { text-align: center; color: #9c8770; font-size: 12px; }
  .chart-container { height: 250px; }
  select { padding: 8px 16px; border-radius: 20px; border: 1px solid #f5c77c; }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: white; border-radius: 20px; padding: 32px; text-align: center; max-width: 360px; width: 90%; }
  .modal-content.alarm h2 { color: #e85d2c; }
  .modal-content.care h2 { color: #6f8f71; }
  .btn-cancel { background: #6f8f71; }
  .btn-secondary { background: #9c8770; }
  @media (max-width: 480px) { .overview { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div style="font-size:48px;">🧡</div>
    <h1>心連心智能平安鐘</h1>
  </div>

  <div class="overview">
    <div class="overview-item fall">
      <div class="icon">🏃</div>
      <div class="label">跌倒事件</div>
      <div class="count" id="todayFall">0</div>
      <div class="label">次</div>
    </div>
    <div class="overview-item care">
      <div class="icon">💚</div>
      <div class="label">關懷訊號</div>
      <div class="count" id="todayCare">0</div>
      <div class="label">次</div>
    </div>
    <div class="overview-item confirm">
      <div class="icon">✅</div>
      <div class="label">安全確認</div>
      <div class="count" id="todayCancel">0</div>
      <div class="label">次</div>
    </div>
  </div>

  <div style="text-align:center; margin-bottom:16px;">
    <select id="monthFilter" onchange="render()"><option value="all">全部月份</option></select>
  </div>

  <div class="cards">
    <div class="card"><h3>🔔 跌倒偵測</h3><div id="fallStatus" class="big">載入中</div></div>
    <div class="card"><h3>⚠️ 目前警報</h3><div id="alarmStatus" class="big">載入中</div></div>
  </div>

  <div class="section">
    <h2 style="text-align:center;">📈 統計</h2>
    <div class="chart-container"><canvas id="chart"></canvas></div>
  </div>

  <div class="section">
    <h2>📋 每日紀錄</h2>
    <table><thead><tr><th>日期</th><th>跌倒</th><th>關懷</th></tr></thead><tbody id="tableBody"></tbody></table>
  </div>

  <div style="text-align:center;"><button onclick="load()">🔄 重新整理</button></div>
  <div class="footer" id="updateTime"></div>
</div>

<div class="modal" id="alarmModal">
  <div class="modal-content alarm">
    <div style="font-size:48px;">🚨</div>
    <h2>緊急警報！</h2>
    <p>偵測到跌倒事件，請確認長者狀況。</p>
    <button class="btn-cancel" onclick="confirmCancel()">✅ 確認取消警報</button>
    <button class="btn-secondary" onclick="closeAlarm()">稍後處理</button>
  </div>
</div>

<div class="modal" id="careModal">
  <div class="modal-content care">
    <div style="font-size:48px;">💚</div>
    <h2>收到關懷</h2>
    <p>長者發送了關懷訊號。</p>
    <button class="btn-cancel" onclick="closeCare()">✅ 知道了</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzi-W6qVuU0KA58SYckbRaL4RSSDFcdRP8P57ejqqnfk7U3GyiJb_JU79X-bSskY-o-Iw/exec";
let chart, daily = {}, months = new Set();
let lastAlarming = false, lastCareCount = 0;

function parseDate(s) {
  const m = s.match(/(\w+)\s+(\d+)\s+(\d+)/);
  if (!m) return "";
  const mon = {January:"01",February:"02",March:"03",April:"04",May:"05",June:"06",July:"07",August:"08",September:"09",October:"10",November:"11",December:"12"};
  return m[3] + "-" + (mon[m[1]]||"01") + "-" + m[2].padStart(2,"0");
}

function weekday(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return (dt.getMonth()+1) + "/" + dt.getDate() + " (" + "日一二三四五六"[dt.getDay()] + ")";
}

function showAlarm() { document.getElementById("alarmModal").classList.add("show"); }
function closeAlarm() { document.getElementById("alarmModal").classList.remove("show"); }
function showCare() { document.getElementById("careModal").classList.add("show"); }
function closeCare() { document.getElementById("careModal").classList.remove("show"); }

async function confirmCancel() {
  try {
    const res = await fetch(API + "?action=cancel&t=" + Date.now());
    const result = await res.json();
    if (result.success) { closeAlarm(); lastAlarming = false; setTimeout(load, 2000); }
  } catch(e) { alert("取消失敗"); }
}

async function load() {
  try {
    const res = await fetch(API + "?t=" + Date.now());
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("not array");

    let fallOn = false, alarming = false, totalCare = 0;
    let todayFall = 0, todayCare = 0, todayCancel = 0;
    const today = new Date().toISOString().split("T")[0];
    daily = {}; months = new Set();

    data.forEach(item => {
      const type = (item.type||"").toUpperCase().replace(/_/g, "");
      const date = parseDate(item.time||"");
      if (!date || !type) return;
      const mk = date.substring(0,7);
      months.add(mk);
      if (!daily[date]) daily[date] = {fall:0, care:0};
      
      if (type === "FALLON") fallOn = true;
      if (type === "FALLOFF") fallOn = false;
      if (type === "EMERGENCY") { alarming = true; daily[date].fall++; if (date === today) todayFall++; }
      if (type === "CANCEL") { alarming = false; if (date === today) todayCancel++; }
      if (type === "CARE") { daily[date].care++; totalCare++; if (date === today) todayCare++; }
    });

    document.getElementById("todayFall").textContent = todayFall;
    document.getElementById("todayCare").textContent = todayCare;
    document.getElementById("todayCancel").textContent = todayCancel;

    document.getElementById("fallStatus").textContent = fallOn ? "開啟" : "關閉";
    document.getElementById("fallStatus").className = "big " + (fallOn ? "on" : "off");
    document.getElementById("alarmStatus").textContent = alarming ? "緊急！" : "正常";
    document.getElementById("alarmStatus").className = "big " + (alarming ? "emergency" : "on");

    if (alarming && !lastAlarming) showAlarm();
    lastAlarming = alarming;
    if (!alarming) closeAlarm();
    if (totalCare > lastCareCount && lastCareCount > 0) showCare();
    lastCareCount = totalCare;

    const sel = document.getElementById("monthFilter");
    const cur = sel.value;
    sel.innerHTML = '<option value="all">全部月份</option>';
    [...months].sort().reverse().forEach(m => {
      const [y,mo] = m.split("-");
      sel.innerHTML += `<option value="${m}">${y}年${parseInt(mo)}月</option>`;
    });
    if (cur) sel.value = cur;

    render();
    document.getElementById("updateTime").textContent = "更新：" + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById("fallStatus").textContent = "錯誤";
    console.error(e);
  }
}

function render() {
  const sel = document.getElementById("monthFilter").value;
  let dates = Object.keys(daily).sort().reverse();
  if (sel !== "all") dates = dates.filter(d => d.startsWith(sel));

  const tb = document.getElementById("tableBody");
  tb.innerHTML = dates.slice(0,30).map(d => 
    `<tr><td>${weekday(d)}</td><td>${daily[d].fall}</td><td>${daily[d].care}</td></tr>`
  ).join("");

  const cd = dates.slice(0,14).reverse();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: cd.map(d => weekday(d)),
      datasets: [
        { label: "跌倒", data: cd.map(d => daily[d]?.fall||0), borderColor: "#e85d2c", tension: 0.3 },
        { label: "關懷", data: cd.map(d => daily[d]?.care||0), borderColor: "#6f8f71", tension: 0.3 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
